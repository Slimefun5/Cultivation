cultivation:
  bush_harvest:
    name: Берба од грмушки
    lore:
    - Овој предмет може да се обере од
    - грмушка од Култивејшн
  tree_harvest:
    name: Берба од дрвја
    lore:
    - Овој предмет може да се обере од
    - дрво од Култивејшн
  trading_farmer:
    name: Трговија со селани
    lore:
    - Овој предмет може да се купи од
    - селанец земјоделец.
  trading_fletcher:
    name: Трговија со селани
    lore:
    - Овој предмет може да се купи од
    - селанец стрелар.
  mob:
    name: Плен од суштества
    lore:
    - Овој предмет има шанса да падне од
    - следните суштества.
  plant_breeding:
    name: Вкрстување растенија
    lore:
    - Ова семе се добива со вкрстување.
    - Растенијата се вкрстуваат така што
    - поставуваш две растенија со еден блок воздух
    - меѓу нив.
    - ''
    - Речникот за вкрстување може да се користи
    - за следење на твоите откритија.
    - ''
    - 'Совет: Црните честички значат дека'
    - двете растенија НЕ МОЖАТ да се вкрстат.
  vanilla_block_drop:
    name: Плен од светот
    lore:
    - Паѓа од блокови кога ќе се скршат во светот.
  bucketing:
    name: Плен од светот
    lore:
    - Се добива од светот со кофа.
  chopped:
    name: Сецкано
    lore:
    - Само исецкај со нож!
  mashed:
    name: Пасирано
    lore:
    - Гмечи гмечи гмечи
  blended:
    name: Миксано
    lore:
    - Се прави со ставање предмет во блендерот.
  sliced:
    name: Нарежано
    lore:
    - Толку тенко и нежно
  ground:
    name: Мелено
    lore:
    - До фина мерка
  boiled:
    name: Варено
    lore:
    - Жешко жешко жешко!
  fried:
    name: Пржено
    lore:
    - Хрскаво совршенство.
  grilled:
    name: На скара
    lore:
    - Сочно и мекичко.
  finishing:
    name: Довршување
    lore:
    - Користи го кујнскиот пулт за довршување за да го направиш овој предмет.
  baking:
    name: Печење
    lore:
    - Користи го кујнскиот пулт со рерна за да го направиш овој предмет.
