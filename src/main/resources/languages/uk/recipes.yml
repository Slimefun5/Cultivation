cultivation:
  bush_harvest:
    name: Збирання з кущів
    lore:
    - Цей предмет можна зібрати з
    - куща Культивейшн
  tree_harvest:
    name: Збирання з дерев
    lore:
    - Цей предмет можна зібрати з
    - дерева Культивейшн
  trading_farmer:
    name: Торгівля із селянами
    lore:
    - Цей предмет можна купити в
    - селянина-фермера.
  trading_fletcher:
    name: Торгівля із селянами
    lore:
    - Цей предмет можна купити в
    - селянина-стрілороба.
  mob:
    name: Здобич із мобів
    lore:
    - Цей предмет може випасти з
    - таких мобів.
  plant_breeding:
    name: Схрещування рослин
    lore:
    - Це насіння можна отримати схрещуванням.
    - Щоб схрестити рослини, посади
    - дві рослини з блоком повітря
    - між ними.
    - ''
    - Словник схрещування допоможе
    - стежити за твоїми відкриттями.
    - ''
    - 'Підказка: чорні частинки означають, що'
    - ці дві рослини НЕ МОЖНА схрестити.
  vanilla_block_drop:
    name: Здобич зі світу
    lore:
    - Випадає з блоків, якщо зламати їх у світі.
  bucketing:
    name: Здобич зі світу
    lore:
    - Добувається у світі за допомогою відра.
  chopped:
    name: Посічене
    lore:
    - Просто посічи ножем!
  mashed:
    name: Товчене
    lore:
    - Товчи, товчи, товчи
  blended:
    name: Подрібнене
    lore:
    - Готується, якщо покласти предмет у блендер.
  sliced:
    name: Нарізане
    lore:
    - Таке тонке й ніжне
  ground:
    name: Мелене
    lore:
    - До найдрібнішого помелу
  boiled:
    name: Варене
    lore:
    - Гаряче, гаряче, гаряче!
  fried:
    name: Смажене
    lore:
    - Хрустка досконалість.
  grilled:
    name: На грилі
    lore:
    - Соковите й ніжне.
  finishing:
    name: Завершення
    lore:
    - Приготуй цей предмет на кухонному столі для завершення страв.
  baking:
    name: Випікання
    lore:
    - Приготуй цей предмет на кухонному столі з духовкою.
