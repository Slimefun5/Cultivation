cultivation:
  bush_harvest:
    name: เก็บเกี่ยวจากพุ่มไม้
    lore:
    - ไอเท็มนี้เก็บเกี่ยวได้จาก
    - พุ่มไม้คัลทิเวชัน
  tree_harvest:
    name: เก็บเกี่ยวจากต้นไม้
    lore:
    - ไอเท็มนี้เก็บเกี่ยวได้จาก
    - ต้นไม้คัลทิเวชัน
  trading_farmer:
    name: ค้าขายกับชาวบ้าน
    lore:
    - ไอเท็มนี้ซื้อได้จาก
    - ชาวบ้านชาวไร่
  trading_fletcher:
    name: ค้าขายกับชาวบ้าน
    lore:
    - ไอเท็มนี้ซื้อได้จาก
    - ชาวบ้านช่างทำธนู
  mob:
    name: ม็อบดรอป
    lore:
    - ไอเท็มนี้มีโอกาสดรอปจาก
    - ม็อบต่อไปนี้
  plant_breeding:
    name: ผสมพันธุ์พืช
    lore:
    - เมล็ดนี้ได้มาจากการผสมพันธุ์
    - คุณผสมพันธุ์พืชได้โดยวาง
    - พืชสองต้นโดยเว้นบล็อกอากาศ
    - ไว้ตรงกลาง
    - ''
    - ใช้พจนานุกรมการผสมพันธุ์
    - เพื่อติดตามสิ่งที่คุณค้นพบได้
    - ''
    - 'คำใบ้: อนุภาคสีดำหมายความว่า'
    - พืชสองต้นนั้นผสมพันธุ์กันไม่ได้
  vanilla_block_drop:
    name: ดรอปในโลก
    lore:
    - ดรอปจากบล็อกเมื่อทุบในโลก
  bucketing:
    name: ดรอปในโลก
    lore:
    - ได้จากโลกเมื่อใช้ถัง
  chopped:
    name: สับ
    lore:
    - แค่สับด้วยมีด!
  mashed:
    name: บด
    lore:
    - บด บด บด
  blended:
    name: ปั่น
    lore:
    - ทำโดยใส่ไอเท็มลงในเครื่องปั่น
  sliced:
    name: หั่นบาง
    lore:
    - บางเฉียบและละเอียดอ่อน
  ground:
    name: โขลก
    lore:
    - ละเอียดยิบ
  boiled:
    name: ต้ม
    lore:
    - ร้อน ร้อน ร้อน!
  fried:
    name: ทอด
    lore:
    - กรอบได้ที่
  grilled:
    name: ย่าง
    lore:
    - ฉ่ำและนุ่ม
  finishing:
    name: จัดจาน
    lore:
    - ใช้เคาน์เตอร์จัดจานในครัวเพื่อทำไอเท็มนี้
  baking:
    name: อบ
    lore:
    - ใช้เคาน์เตอร์เตาอบในครัวเพื่อทำไอเท็มนี้
