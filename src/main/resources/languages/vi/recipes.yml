  plant_breeding:
    name: Lai tạo cây trồng
    lore:
    - Hạt giống này có được nhờ lai tạo.
    - Bạn lai tạo cây bằng cách đặt
    - hai cây xuống với một khối không khí
    - ở giữa.
    - ''
    - Có thể dùng từ điển lai tạo
    - để theo dõi những khám phá của bạn.
    - ''
    - 'Gợi ý: Hạt màu đen nghĩa là'
    - hai cây KHÔNG THỂ lai tạo.
