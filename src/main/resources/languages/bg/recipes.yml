cultivation:
  bush_harvest:
    name: Събиране от храсти
    lore:
    - Този предмет може да се събере от
    - храст на Култивейшн
  tree_harvest:
    name: Събиране от дървета
    lore:
    - Този предмет може да се събере от
    - дърво на Култивейшн
  trading_farmer:
    name: Търговия със селяни
    lore:
    - Този предмет може да се купи от
    - селянин фермер.
  trading_fletcher:
    name: Търговия със селяни
    lore:
    - Този предмет може да се купи от
    - селянин стрелар.
  mob:
    name: Плячка от създания
    lore:
    - Този предмет може да падне от
    - следните създания.
  plant_breeding:
    name: Кръстосване на растения
    lore:
    - Това семе се открива чрез кръстосване.
    - Кръстосваш растения, като поставиш
    - две растения с блок въздух
    - между тях.
    - ''
    - Речникът за кръстосване може да се използва
    - за следене на откритията ти.
    - ''
    - 'Подсказка: Черните частици означават, че'
    - двете растения НЕ МОГАТ да се кръстосат.
  vanilla_block_drop:
    name: Плячка от света
    lore:
    - Пада от блокове, когато се чупят в света.
  bucketing:
    name: Плячка от света
    lore:
    - Добива се от света с кофа.
  chopped:
    name: Накълцано
    lore:
    - Просто накълцай с нож!
  mashed:
    name: Намачкано
    lore:
    - Мач, мач, мач
  blended:
    name: Пасирано
    lore:
    - Прави се, като сложиш предмет в блендера.
  sliced:
    name: Нарязано
    lore:
    - Толкова тънко и деликатно
  ground:
    name: Смляно
    lore:
    - До фина степен
  boiled:
    name: Варено
    lore:
    - Горещо, горещо, горещо!
  fried:
    name: Пържено
    lore:
    - Хрупкаво съвършенство.
  grilled:
    name: На скара
    lore:
    - Сочно и крехко.
  finishing:
    name: Довършване
    lore:
    - Използвай плота за довършване в кухнята, за да направиш този предмет.
  baking:
    name: Печене
    lore:
    - Използвай плота с фурна в кухнята, за да направиш този предмет.
