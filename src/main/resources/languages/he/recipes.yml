cultivation:
  bush_harvest:
    name: קטיף משיחים
    lore:
    - אפשר לקטוף את הפריט הזה
    - משיח של קולטיביישן
  tree_harvest:
    name: קטיף מעצים
    lore:
    - אפשר לקטוף את הפריט הזה
    - מעץ של קולטיביישן
  trading_farmer:
    name: סחר עם כפריים
    lore:
    - אפשר לקנות את הפריט הזה
    - מכפרי חקלאי.
  trading_fletcher:
    name: סחר עם כפריים
    lore:
    - אפשר לקנות את הפריט הזה
    - מכפרי חצים.
  mob:
    name: שלל יצורים
    lore:
    - יש סיכוי שהפריט הזה ייפול
    - מהיצורים הבאים.
  plant_breeding:
    name: הכלאת צמחים
    lore:
    - את הזרע הזה מוצאים באמצעות הכלאה.
    - מכליאים צמחים על ידי הנחת
    - שני צמחים עם בלוק אוויר
    - ביניהם.
    - ''
    - אפשר להשתמש במילון ההכלאות
    - כדי לעקוב אחרי התגליות שלכם.
    - ''
    - 'רמז: חלקיקים שחורים אומרים ששני'
    - הצמחים לא יכולים להכליא.
  vanilla_block_drop:
    name: שלל מהעולם
    lore:
    - נופל מבלוקים כששוברים אותם בעולם.
  bucketing:
    name: שלל מהעולם
    lore:
    - נאסף מהעולם בעזרת דלי.
  chopped:
    name: קצוץ
    lore:
    - פשוט לקצוץ עם סכין!
  mashed:
    name: מעוך
    lore:
    - למעוך, למעוך, למעוך
  blended:
    name: מעורבל
    lore:
    - מכינים על ידי הכנסת פריט לבלנדר.
  sliced:
    name: פרוס
    lore:
    - כל כך דק ועדין
  ground:
    name: טחון
    lore:
    - עד דרגה דקה
  boiled:
    name: מבושל
    lore:
    - חם חם חם!
  fried:
    name: מטוגן
    lore:
    - פריכות מושלמת.
  grilled:
    name: צלוי
    lore:
    - עסיסי ורך.
  finishing:
    name: גימור
    lore:
    - השתמשו בדלפק הגימור של המטבח כדי להכין את הפריט הזה.
  baking:
    name: אפייה
    lore:
    - השתמשו בדלפק התנור של המטבח כדי להכין את הפריט הזה.
