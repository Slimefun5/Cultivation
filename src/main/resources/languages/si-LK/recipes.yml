cultivation:
  bush_harvest:
    name: පඳුරු අස්වනු නෙළීම
    lore:
    - මෙම අයිතමය කල්ටිවේෂන් පඳුරකින්
    - අස්වනු ලෙස නෙළාගත හැක
  tree_harvest:
    name: ගස් අස්වනු නෙළීම
    lore:
    - මෙම අයිතමය කල්ටිවේෂන් ගසකින්
    - අස්වනු ලෙස නෙළාගත හැක
  trading_farmer:
    name: ගැමියන් සමඟ වෙළඳාම
    lore:
    - මෙම අයිතමය ගොවි ගැමියෙකුගෙන්
    - මිලදී ගත හැක.
  trading_fletcher:
    name: ගැමියන් සමඟ වෙළඳාම
    lore:
    - මෙම අයිතමය ඊතල සාදන ගැමියෙකුගෙන්
    - මිලදී ගත හැක.
  mob:
    name: සත්ත්ව හැලීම
    lore:
    - මෙම අයිතමය පහත සතුන්ගෙන්
    - හැලීමට ඉඩක් ඇත.
  plant_breeding:
    name: ශාක අභිජනනය
    lore:
    - මෙම බීජය හමුවන්නේ අභිජනනයෙනි.
    - ශාක අභිජනනය කරන්නේ ශාක දෙකක්
    - අතරට වාත කුට්ටියක් ඉතිරි වන
    - සේ ඒවා තැබීමෙනි.
    - ''
    - ඔබේ සොයාගැනීම් සටහන් කරගැනීමට
    - අභිජනන ශබ්දකෝෂය භාවිත කළ හැක.
    - ''
    - 'ඉඟිය: කළු අංශු යනු එම ශාක දෙකට'
    - අභිජනනය විය නොහැකි බවයි.
  vanilla_block_drop:
    name: ලෝක හැලීම
    lore:
    - ලෝකයේ කුට්ටි කැඩූ විට ඒවායින් හැලේ.
  bucketing:
    name: ලෝක හැලීම
    lore:
    - බාල්දියක් භාවිත කරන විට ලෝකයෙන් ලැබේ.
  chopped:
    name: කුඩාවට කැපූ
    lore:
    - පිහියකින් කපන්න විතරයි!
  mashed:
    name: පොඩි කළ
    lore:
    - පොඩි කරන් පොඩි කරන් පොඩි කරන්
  blended:
    name: බ්ලෙන්ඩ් කළ
    lore:
    - අයිතමයක් බ්ලෙන්ඩරයට දැමීමෙන් සාදයි.
  sliced:
    name: පෙති කැපූ
    lore:
    - හරිම තුනී, සියුම්
  ground:
    name: ඇඹරූ
    lore:
    - හොඳටම සියුම්ව
  boiled:
    name: තැම්බූ
    lore:
    - රත් රත් රත්!
  fried:
    name: බැදපු
    lore:
    - හැපෙන පරිපූර්ණත්වය.
  grilled:
    name: ග්‍රිල් කළ
    lore:
    - යුෂ පිරි සහ මෘදුයි.
  finishing:
    name: නිම කිරීම
    lore:
    - මෙම අයිතමය සෑදීමට මුළුතැන්ගෙයි නිම කිරීමේ කවුන්ටරය භාවිත කරන්න.
  baking:
    name: බේක් කිරීම
    lore:
    - මෙම අයිතමය සෑදීමට මුළුතැන්ගෙයි උඳුන් කවුන්ටරය භාවිත කරන්න.
