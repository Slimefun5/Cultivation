cultivation:
  bush_harvest:
    name: Συγκομιδή από Θάμνο
    lore:
    - Αυτό το αντικείμενο συλλέγεται από
    - Θάμνο του Καλτιβέισον
  tree_harvest:
    name: Συγκομιδή από Δέντρο
    lore:
    - Αυτό το αντικείμενο συλλέγεται από
    - Δέντρο του Καλτιβέισον
  trading_farmer:
    name: Εμπόριο με Χωρικούς
    lore:
    - Αυτό το αντικείμενο αγοράζεται από
    - Χωρικό αγρότη.
  trading_fletcher:
    name: Εμπόριο με Χωρικούς
    lore:
    - Αυτό το αντικείμενο αγοράζεται από
    - Χωρικό βελοποιό.
  mob:
    name: Λάφυρο Πλάσματος
    lore:
    - Αυτό το αντικείμενο μπορεί να πέσει από
    - τα παρακάτω πλάσματα.
  plant_breeding:
    name: Διασταύρωση Φυτών
    lore:
    - Αυτός ο σπόρος βρίσκεται μέσω διασταύρωσης.
    - Διασταυρώνεις φυτά τοποθετώντας
    - δύο φυτά με ένα μπλοκ αέρα
    - ανάμεσά τους.
    - ''
    - Το λεξικό διασταυρώσεων μπορεί να χρησιμοποιηθεί
    - για να καταγράφεις τις ανακαλύψεις σου.
    - ''
    - 'Υπόδειξη: Τα μαύρα σωματίδια σημαίνουν ότι τα'
    - δύο φυτά ΔΕΝ ΜΠΟΡΟΥΝ να διασταυρωθούν.
  vanilla_block_drop:
    name: Λάφυρο Κόσμου
    lore:
    - Πέφτει από μπλοκ όταν σπάνε στον κόσμο.
  bucketing:
    name: Λάφυρο Κόσμου
    lore:
    - Λαμβάνεται από τον κόσμο με κουβά.
  chopped:
    name: Ψιλοκομμένο
    lore:
    - Απλώς ψιλόκοψέ το με μαχαίρι!
  mashed:
    name: Πολτοποιημένο
    lore:
    - Λιώσ' το, λιώσ' το, λιώσ' το
  blended:
    name: Χτυπημένο
    lore:
    - Φτιάχνεται βάζοντας ένα αντικείμενο στο μπλέντερ.
  sliced:
    name: Σε Φέτες
    lore:
    - Τόσο λεπτό και ευαίσθητο
  ground:
    name: Αλεσμένο
    lore:
    - Σε ψιλή άλεση
  boiled:
    name: Βραστό
    lore:
    - Καυτό καυτό καυτό!
  fried:
    name: Τηγανητό
    lore:
    - Τραγανή Τελειότητα.
  grilled:
    name: Σχάρας
    lore:
    - Ζουμερό και Τρυφερό.
  finishing:
    name: Τελικό Στάδιο
    lore:
    - Χρησιμοποίησε τον πάγκο τελικού σταδίου της κουζίνας για να φτιάξεις αυτό το αντικείμενο.
  baking:
    name: Ψήσιμο στον Φούρνο
    lore:
    - Χρησιμοποίησε τον πάγκο φούρνου της κουζίνας για να φτιάξεις αυτό το αντικείμενο.
