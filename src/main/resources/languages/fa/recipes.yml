cultivation:
  bush_harvest:
    name: برداشت از بوته
    lore:
    - این آیتم را می‌توان از یک
    - بوته کالتیویشن برداشت کرد
  tree_harvest:
    name: برداشت از درخت
    lore:
    - این آیتم را می‌توان از یک
    - درخت کالتیویشن برداشت کرد
  trading_farmer:
    name: تجارت با روستایی
    lore:
    - این آیتم را می‌توان از یک
    - روستایی کشاورز خرید.
  trading_fletcher:
    name: تجارت با روستایی
    lore:
    - این آیتم را می‌توان از یک
    - روستایی تیرساز خرید.
  mob:
    name: افتادن از موجود
    lore:
    - این آیتم ممکن است از
    - موجود(های) زیر بیفتد.
  plant_breeding:
    name: پرورش گیاه
    lore:
    - این بذر از راه پرورش پیدا می‌شود.
    - گیاهان را با گذاشتن
    - دو گیاه با یک بلوک هوا
    - بینشان پرورش می‌دهی.
    - ''
    - از فرهنگ پرورش می‌توان
    - برای ثبت کشفیاتت استفاده کرد.
    - ''
    - 'راهنما: ذرات سیاه یعنی آن'
    - دو گیاه نمی‌توانند پرورش یابند.
  vanilla_block_drop:
    name: افتادن در جهان
    lore:
    - وقتی بلوک‌ها در جهان شکسته شوند می‌افتد.
  bucketing:
    name: افتادن در جهان
    lore:
    - با استفاده از سطل از جهان به دست می‌آید.
  chopped:
    name: خردشده
    lore:
    - فقط با چاقو خردش کن!
  mashed:
    name: پوره‌شده
    lore:
    - له کن له کن له کن
  blended:
    name: مخلوط‌شده
    lore:
    - با گذاشتن یک آیتم در مخلوط‌کن ساخته می‌شود.
  sliced:
    name: برش‌خورده
    lore:
    - خیلی نازک و ظریف
  ground:
    name: کوبیده
    lore:
    - تا حد ریز و نرم
  boiled:
    name: آب‌پز
    lore:
    - داغ داغ داغ!
  fried:
    name: سرخ‌شده
    lore:
    - برشتگی بی‌نقص.
  grilled:
    name: کبابی
    lore:
    - آبدار و لطیف.
  finishing:
    name: تکمیل
    lore:
    - برای ساخت این آیتم از پیشخوان تکمیل آشپزخانه استفاده کن.
  baking:
    name: پخت در فر
    lore:
    - برای ساخت این آیتم از پیشخوان فر آشپزخانه استفاده کن.
