  plant_breeding:
    name: Augalų veisimas
    lore:
    - Ši sėkla gaunama veisiant.
    - Augalus veisi pastatydamas
    - du augalus su oro bloku
    - tarp jų.
    - ''
    - Veisimo žodyne gali
    - sekti savo atradimus.
    - ''
    - 'Užuomina: juodos dalelės reiškia, kad'
    - šie du augalai NEGALI veistis.
  vanilla_block_drop:
    name: Pasaulio grobis
    lore:
