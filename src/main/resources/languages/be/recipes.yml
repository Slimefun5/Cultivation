cultivation:
  bush_harvest:
    name: Збор з кустоў
    lore:
    - Гэты прадмет можна сабраць з
    - куста Культывейшн
  tree_harvest:
    name: Збор з дрэў
    lore:
    - Гэты прадмет можна сабраць з
    - дрэва Культывейшн
  trading_farmer:
    name: Гандаль з вяскоўцамі
    lore:
    - Гэты прадмет можна купіць у
    - вяскоўца-фермера.
  trading_fletcher:
    name: Гандаль з вяскоўцамі
    lore:
    - Гэты прадмет можна купіць у
    - вяскоўца-лучніка.
  mob:
    name: Здабыча з мобаў
    lore:
    - Гэты прадмет можа выпасці з
    - наступных мобаў.
  plant_breeding:
    name: Скрыжаванне раслін
    lore:
    - Гэтае насенне атрымліваюць скрыжаваннем.
    - Каб скрыжаваць расліны, пасадзіце
    - дзве расліны з адным блокам паветра
    - паміж імі.
    - ''
    - Слоўнік скрыжаванняў дапамагае
    - сачыць за вашымі адкрыццямі.
    - ''
    - 'Падказка: чорныя часціцы азначаюць, што'
    - дзве расліны НЕ МОГУЦЬ скрыжавацца.
  vanilla_block_drop:
    name: Здабыча са свету
    lore:
    - Выпадае з блокаў, калі іх разбіваць у свеце.
  bucketing:
    name: Здабыча са свету
    lore:
    - Здабываецца ў свеце з дапамогай вядра.
  chopped:
    name: Сячэнне
    lore:
    - Проста пасячыце нажом!
  mashed:
    name: Таўчэнне
    lore:
    - Таўчы, таўчы, таўчы
  blended:
    name: Блэндар
    lore:
    - Робіцца, калі пакласці прадмет у блэндар.
  sliced:
    name: Нарэзка
    lore:
    - Такі тонкі і далікатны
  ground:
    name: Памол
    lore:
    - Да самага дробнага
  boiled:
    name: Варэнне
    lore:
    - Гарача, гарача, гарача!
  fried:
    name: Смажанне
    lore:
    - Хрумсткая дасканаласць.
  grilled:
    name: Грыль
    lore:
    - Сакавіта і пяшчотна.
  finishing:
    name: Завяршэнне
    lore:
    - Выкарыстайце кухонную стойку завяршэння, каб зрабіць гэты прадмет.
  baking:
    name: Выпечка
    lore:
    - Выкарыстайце кухонную стойку з духоўкай, каб зрабіць гэты прадмет.
