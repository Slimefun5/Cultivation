cultivation:
  bush_harvest:
    name: Берба са жбуна
    lore:
    - Овај предмет се може убрати са
    - Калтивејшн жбуна
  tree_harvest:
    name: Берба са дрвета
    lore:
    - Овај предмет се може убрати са
    - Калтивејшн дрвета
  trading_farmer:
    name: Трговина са сељаком
    lore:
    - Овај предмет се може купити од
    - сељака фармера.
  trading_fletcher:
    name: Трговина са сељаком
    lore:
    - Овај предмет се може купити од
    - сељака стрелара.
  mob:
    name: Плен од створења
    lore:
    - Овај предмет може да испадне из
    - следећих створења.
  plant_breeding:
    name: Укрштање биљака
    lore:
    - Ово семе се добија укрштањем.
    - Биљке укршташ тако што поставиш
    - две биљке са блоком ваздуха
    - између њих.
    - ''
    - Речник укрштања служи
    - за праћење твојих открића.
    - ''
    - 'Савет: Црне честице значе да се'
    - те две биљке НЕ МОГУ укрстити.
  vanilla_block_drop:
    name: Плен из света
    lore:
    - Испада из блокова кад се разбију у свету.
  bucketing:
    name: Плен из света
    lore:
    - Добија се из света помоћу кофе.
  chopped:
    name: Сецкано
    lore:
    - Само исецкај ножем!
  mashed:
    name: Гњечено
    lore:
    - Гњечи гњечи гњечи
  blended:
    name: Блендирано
    lore:
    - Прави се стављањем предмета у блендер.
  sliced:
    name: Резано
    lore:
    - Тако танко и нежно
  ground:
    name: Млевено
    lore:
    - Фино самлевено
  boiled:
    name: Кувано
    lore:
    - Вруће вруће вруће!
  fried:
    name: Пржено
    lore:
    - Хрскаво савршенство.
  grilled:
    name: Гриловано
    lore:
    - Сочно и мекано.
  finishing:
    name: Завршна обрада
    lore:
    - Користи кухињски пулт за завршну обраду да направиш овај предмет.
  baking:
    name: Печење
    lore:
    - Користи кухињски пулт са рерном да направиш овај предмет.
