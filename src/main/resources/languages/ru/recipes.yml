cultivation:
  bush_harvest:
    name: Сбор с куста
    lore:
    - Этот предмет можно собрать с
    - куста Культивейшн
  tree_harvest:
    name: Сбор с дерева
    lore:
    - Этот предмет можно собрать с
    - дерева Культивейшн
  trading_farmer:
    name: Торговля с крестьянами
    lore:
    - Этот предмет можно купить у
    - крестьянина-фермера.
  trading_fletcher:
    name: Торговля с крестьянами
    lore:
    - Этот предмет можно купить у
    - крестьянина-лучника.
  mob:
    name: Добыча с мобов
    lore:
    - Этот предмет может выпасть
    - из следующих мобов.
  plant_breeding:
    name: Скрещивание растений
    lore:
    - Это семя можно получить скрещиванием.
    - Чтобы скрестить растения, поставь
    - два растения так, чтобы между ними
    - был один блок воздуха.
    - ''
    - Словарь скрещивания поможет
    - отслеживать твои открытия.
    - ''
    - 'Подсказка: чёрные частицы значат, что'
    - эти два растения НЕ МОГУТ скреститься.
  vanilla_block_drop:
    name: Добыча в мире
    lore:
    - Выпадает из блоков при их разрушении в мире.
  bucketing:
    name: Добыча в мире
    lore:
    - Добывается в мире с помощью ведра.
  chopped:
    name: Рубка
    lore:
    - Просто наруби ножом!
  mashed:
    name: Толчение
    lore:
    - Толчём, толчём, толчём
  blended:
    name: Блендер
    lore:
    - Делается, если положить предмет в блендер.
  sliced:
    name: Нарезка
    lore:
    - Так тонко и изящно
  ground:
    name: Помол
    lore:
    - Мелко-мелко
  boiled:
    name: Варка
    lore:
    - Горячо, горячо, горячо!
  fried:
    name: Жарка
    lore:
    - Хрустящее совершенство.
  grilled:
    name: Гриль
    lore:
    - Сочно и нежно.
  finishing:
    name: Сервировка
    lore:
    - Приготовь этот предмет на кухонной стойке для сервировки.
  baking:
    name: Выпечка
    lore:
    - Приготовь этот предмет в духовке кухонной стойки.
